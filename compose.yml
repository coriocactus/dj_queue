services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dj_queue_test
      POSTGRES_USER: dj_queue
      POSTGRES_PASSWORD: dj_queue
    ports:
      - "17432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj_queue -d dj_queue_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: dj_queue_test
      MYSQL_USER: dj_queue
      MYSQL_PASSWORD: dj_queue
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "17312:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -u dj_queue -pdj_queue -e 'SELECT 1' dj_queue_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  mariadb:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: dj_queue_test
      MARIADB_USER: dj_queue
      MARIADB_PASSWORD: dj_queue
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "17306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 15
