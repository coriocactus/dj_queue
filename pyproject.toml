[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"

[project]
name = "dj-queue"
version = "0.13.0"
description = "Database-backed task queue backend for Django’s Tasks framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=6.0.0,<6.1",
]

[project.urls]
Homepage = "https://github.com/coriocactus/dj_queue"
Repository = "https://github.com/coriocactus/dj_queue"
Issues = "https://github.com/coriocactus/dj_queue/issues"

[project.optional-dependencies]
postgres = ["psycopg>=3.3.3"]
prometheus = ["prometheus_client>=0.4.0"]

[dependency-groups]
dev = [
  "cryptography>=46.0.6",
  "prometheus-client>=0.4.0",
  "psycopg>=3.3.3",
  "pymysql>=1.1.2",
  "pytest>=9.0.2",
  "pytest-django>=4.12.0",
  "ruff>=0.15.8",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
  "postgres: requires PostgreSQL 14+",
  "mysql: requires MySQL 8+",
  "mariadb: requires MariaDB 10.6+",
]

[tool.ruff]
target-version = "py312"
line-length = 99
indent-width = 2
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint.per-file-ignores]
"bin/admin.py" = ["E402"]
"dj_queue/contrib/asgi.py" = ["BLE001"]
"dj_queue/contrib/gunicorn.py" = ["BLE001"]
"dj_queue/hooks.py" = ["BLE001"]
"dj_queue/models/*.py" = ["RUF012"]
"dj_queue/operations/jobs.py" = ["BLE001"]
"dj_queue/runtime/*.py" = ["BLE001"]
"examples/_example.py" = ["BLE001"]
"examples/_server_app.py" = ["E402"]
"examples/_settings.py" = ["E402"]
"examples/ex24_advanced_multi_db.py" = ["E402"]
"examples/ex25_advanced_asgi.py" = ["E402"]
"examples/ex26_advanced_uvicorn.py" = ["E402"]
"examples/ex27_advanced_gunicorn.py" = ["E402"]
"tests/**/*.py" = ["BLE001"]
