[project]
name = "dj-queue"
version = "0.1.0"
description = "Database-backed task queue backend for Django's django.tasks framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.3",
]

[dependency-groups]
dev = [
    "psycopg>=3.3.3",
    "pymysql>=1.1.2",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
    "postgres: requires PostgreSQL",
    "mysql: requires MySQL 8+",
    "mariadb: requires MariaDB 10.6+",
]

[tool.ruff]
target-version = "py312"
line-length = 120
