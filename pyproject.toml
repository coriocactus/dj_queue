[project]
name = "dj-queue"
version = "0.1.0"
description = "Database-backed task queue backend for Django's django.tasks framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "croniter>=6.2.2",
  "django>=6.0.3",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "cryptography>=46.0.6",
  "psycopg>=3.3.3",
  "pymysql>=1.1.2",
  "pytest>=9.0.2",
  "pytest-django>=4.12.0",
  "ruff>=0.15.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
  "postgres: requires PostgreSQL",
  "mysql: requires MySQL 8+",
  "mariadb: requires MariaDB 10.6+",
]

[tool.ruff]
target-version = "py312"
line-length = 99
indent-width = 2

exclude = [
  'dj_queue/migrations/*',
]

[tool.uv]
exclude-newer = "1 week"
