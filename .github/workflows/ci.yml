name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.0.0
      - run: ruff check
      - run: ruff format --check --diff

  package:
    name: Package
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.19"
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --with 'django>=6.0,<6.1' --with dist/*.whl tests/smoke_publish.py
      - run: uv run --isolated --no-project --with 'django>=6.1,<6.2' --with dist/*.whl tests/smoke_publish.py
      - run: uv run --isolated --no-project --with 'django>=6.0,<6.1' --with dist/*.tar.gz tests/smoke_publish.py
      - run: uv run --isolated --no-project --with 'django>=6.1,<6.2' --with dist/*.tar.gz tests/smoke_publish.py

  sqlite:
    name: SQLite / Django ${{ matrix.django.version }} / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        django:
          - version: "6.0"
            group: django60
          - version: "6.1"
            group: django61
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group ${{ matrix.django.group }}
      - run: uv run --no-sync pytest
        env:
          DB_BACKEND: sqlite

  postgres:
    name: PostgreSQL ${{ matrix.postgres-version }} / Django ${{ matrix.django }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres-version: "14"
            django: "6.0"
            group: django60
          - postgres-version: "15"
            django: "6.1"
            group: django61
          - postgres-version: "16"
            django: "6.1"
            group: django61
          - postgres-version: "17"
            django: "6.1"
            group: django61
          - postgres-version: "18"
            django: "6.0"
            group: django60
          - postgres-version: "18"
            django: "6.1"
            group: django61
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: dj_queue_test
          POSTGRES_USER: dj_queue
          POSTGRES_PASSWORD: dj_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dj_queue -d dj_queue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --group ${{ matrix.group }}
      - run: uv run --no-sync pytest
        env:
          DB_BACKEND: postgres
          DB_PORT: "5432"

  mysql:
    name: MySQL ${{ matrix.mysql-version }} / Django ${{ matrix.django }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql-version: "8.0"
            django: "6.0"
            group: django60
          - mysql-version: "8.4"
            django: "6.1"
            group: django61
          - mysql-version: "9.7"
            django: "6.1"
            group: django61
          - mysql-version: "26.7"
            django: "6.0"
            group: django60
          - mysql-version: "26.7"
            django: "6.1"
            group: django61
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: dj_queue_test
          MYSQL_USER: dj_queue
          MYSQL_PASSWORD: dj_queue
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -u dj_queue -pdj_queue -e 'SELECT 1' dj_queue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --group ${{ matrix.group }}
      - run: uv run --no-sync pytest
        env:
          DB_BACKEND: mysql
          DB_PORT: "3306"

  mariadb:
    name: MariaDB ${{ matrix.mariadb-version }} / Django ${{ matrix.django }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mariadb-version: "10.6"
            django: "6.0"
            group: django60
          - mariadb-version: "10.11"
            django: "6.1"
            group: django61
          - mariadb-version: "11.4"
            django: "6.1"
            group: django61
          - mariadb-version: "11.8"
            django: "6.1"
            group: django61
          - mariadb-version: "12.3"
            django: "6.0"
            group: django60
          - mariadb-version: "12.3"
            django: "6.1"
            group: django61
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_DATABASE: dj_queue_test
          MARIADB_USER: dj_queue
          MARIADB_PASSWORD: dj_queue
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --group ${{ matrix.group }}
      - run: uv run --no-sync pytest
        env:
          DB_BACKEND: mariadb
          DB_PORT: "3306"
