name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"

  package:
    name: Package
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.4"
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --with dist/*.whl tests/smoke_publish.py
      - run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_publish.py

  sqlite:
    name: SQLite / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest
        env:
          DB_BACKEND: sqlite

  postgres:
    name: PostgreSQL ${{ matrix.postgres-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: dj_queue_test
          POSTGRES_USER: dj_queue
          POSTGRES_PASSWORD: dj_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dj_queue -d dj_queue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest
        env:
          DB_BACKEND: postgres
          DB_PORT: "5432"

  mysql:
    name: MySQL ${{ matrix.mysql-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: dj_queue_test
          MYSQL_USER: dj_queue
          MYSQL_PASSWORD: dj_queue
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -u dj_queue -pdj_queue -e 'SELECT 1' dj_queue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest
        env:
          DB_BACKEND: mysql
          DB_PORT: "3306"

  mariadb:
    name: MariaDB ${{ matrix.mariadb-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb-version: ["10.6", "10.11", "11.4", "11.8"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_DATABASE: dj_queue_test
          MARIADB_USER: dj_queue
          MARIADB_PASSWORD: dj_queue
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest
        env:
          DB_BACKEND: mariadb
          DB_PORT: "3306"
