name: Mixed-version upgrade check

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: Release N-1 Git ref
        required: true
        type: string
      to_ref:
        description: Release N Git ref
        required: true
        type: string
  workflow_call:
    inputs:
      from_ref:
        description: Release N-1 Git ref
        required: true
        type: string
      to_ref:
        description: Release N Git ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    name: ${{ matrix.image }} / Django 6.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:14
            port: 5432
            user: dj_queue
            password: dj_queue
            health: >-
              --health-cmd "pg_isready -U dj_queue -d postgres"
              --health-interval 2s
              --health-timeout 5s
              --health-retries 30
          - database: mysql
            image: mysql:8.0
            port: 3306
            user: root
            password: root
            health: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
              --health-interval 2s
              --health-timeout 5s
              --health-retries 30
          - database: mariadb
            image: mariadb:10.6
            port: 3306
            user: root
            password: root
            health: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 2s
              --health-timeout 5s
              --health-retries 30
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: dj_queue
          POSTGRES_PASSWORD: dj_queue
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.health }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"
      - name: Install harness dependencies
        run: uv sync --locked
      - name: Check mixed-version upgrade
        env:
          FROM_REF: ${{ inputs.from_ref }}
          TO_REF: ${{ inputs.to_ref }}
          RESULT_DIR: benchmark-results/${{ matrix.database }}
        run: >-
          bin/prerelease.py
          --from-ref "$FROM_REF"
          --to-ref "$TO_REF"
          --backend "${{ matrix.database }}"
          --django '>=6.0,<6.1'
          --database-host 127.0.0.1
          --database-port "${{ matrix.port }}"
          --database-user "${{ matrix.user }}"
          --database-password "${{ matrix.password }}"
          --result-dir "$RESULT_DIR"
      - name: Upload upgrade artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-${{ matrix.database }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
