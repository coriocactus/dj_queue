name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.4"
      - name: Validate tag matches package version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"

          if tag != expected:
            raise SystemExit(
              f"release tag {tag!r} does not match project version {version!r}"
            )
          PY
      - name: Build
        run: uv build --no-sources
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_publish.py
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_publish.py
      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/
