name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Validate tag matches package version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"

          if tag != expected:
            raise SystemExit(
              f"release tag {tag!r} does not match project version {version!r}"
            )
          PY
      - name: Build
        run: uv build --no-sources
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_publish.py
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_publish.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.7
      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/
