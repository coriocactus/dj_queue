name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.4"
      - name: Build
        run: uv build --no-sources
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_publish.py
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_publish.py
      - name: Publish
        run: uv publish
