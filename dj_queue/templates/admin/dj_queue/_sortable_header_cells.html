{% for header in headers %}
  <th scope="col"{{ header.class_attrib|safe }}>
    {% if header.sortable and header.sorted %}
      <div class="sortoptions">
        <a class="sortremove" href="{{ header.url_remove }}" title="Remove from sorting"></a>
        {% if num_sorted_fields > 1 %}<span class="sortpriority" title="Sorting priority: {{ header.sort_priority }}">{{ header.sort_priority }}</span>{% endif %}
        <a href="{{ header.url_toggle }}" class="toggle {{ header.ascending|yesno:'ascending,descending' }}" title="Toggle sorting"></a>
      </div>
    {% endif %}
    <div class="text">
      {% if header.sortable %}
        <a role="button" href="{{ header.url_primary }}">{{ header.text|capfirst }}</a>
      {% else %}
        <span>{{ header.text|capfirst }}</span>
      {% endif %}
    </div>
    <div class="clear"></div>
  </th>
{% endfor %}
