<div class="{{ controls_class|default:'djq-queue-controls' }}">
  <form method="post" action="{% url 'admin:dj_queue_dashboard_queue_action' queue_name %}">
    {% csrf_token %}
    <input type="hidden" name="backend" value="{{ backend_alias }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <input type="hidden" name="action" value="{% if paused %}resume{% else %}pause{% endif %}">
    <button type="submit" class="{% if paused %}{{ pause_toggle_resume_class }}{% else %}{{ pause_toggle_pause_class }}{% endif %}">{% if paused %}resume{% else %}pause{% endif %}</button>
  </form>
  {% if show_clear %}
    <form method="post" action="{% url 'admin:dj_queue_dashboard_queue_action' queue_name %}">
      {% csrf_token %}
      <input type="hidden" name="backend" value="{{ backend_alias }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <input type="hidden" name="action" value="clear">
      <button type="submit" class="{{ clear_button_class }}">clear ready</button>
    </form>
  {% endif %}
</div>
