{% for semaphore in section.rows %}
  <tr class="{% cycle 'row1' 'row2' %}">
    <th class="djq-col-name"><a href="{{ semaphore.jobs_url }}">{{ semaphore.key }}</a></th>
    <td>{{ semaphore.available_slots }}</td>
    <td>{{ semaphore.limit }}</td>
    <td>{{ semaphore.blocked_waiters }}</td>
    <td>{{ semaphore.expires_at|date:"Y-m-d H:i:s" }}</td>
  </tr>
{% endfor %}
